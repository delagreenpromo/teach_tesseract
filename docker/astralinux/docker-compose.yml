version: "3.8"

services:
  ocr_app:
    build:
      context: ../../
      dockerfile: docker/astralinux/Dockerfile
    container_name: astralinux-ocr_app
    mem_limit: 2g
    user: "${UID}:${GID}"
    working_dir: /app
    env_file:
      - ../../.env
    environment:
      - UID=${UID:-1000}
      - GID=${GID:-1000}
    volumes:
      - ./results:/app/results:rw
      # Монтирование настроек времени
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      
    network_mode: host
    restart: unless-stopped